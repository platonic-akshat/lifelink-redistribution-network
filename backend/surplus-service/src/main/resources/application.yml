server:
  port: 8081

spring:
  application:
    name: surplus-service
  datasource:
    url: jdbc:postgresql://localhost:5432/surplus_db
    username: lifelink
    password: lifelink
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info

# Sweeps surplus postings nearing expiry so matching-service can prioritize
# them. See SurplusExpirySweepJob.
lifelink:
  surplus:
    expiring-soon-window-hours: 6
