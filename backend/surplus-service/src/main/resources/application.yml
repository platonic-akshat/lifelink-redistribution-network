server:
  port: 8081

spring:
  application:
    name: surplus-service
  datasource:
    url: jdbc:postgresql://localhost:5432/surplus_db
    username: lifelink
    password: lifelink
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${LIFELINK_OAUTH2_ISSUER_URI:http://localhost:8180/realms/lifelink}

management:
  endpoints:
    web:
      exposure:
        include: health,info

lifelink:
  verification:
    client-enabled: true
    enforce: true
  coordination:
    base-url: http://localhost:8083
  surplus:
    expiring-soon-window-hours: 6
  outbox:
    relay-delay-ms: 1000
