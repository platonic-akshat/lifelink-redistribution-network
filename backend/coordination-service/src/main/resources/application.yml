server:
  port: 8083

spring:
  application:
    name: coordination-service
  datasource:
    url: jdbc:postgresql://localhost:5432/coordination_db
    username: lifelink
    password: lifelink
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${LIFELINK_OAUTH2_ISSUER_URI:http://localhost:8180/realms/lifelink}

management:
  endpoints:
    web:
      exposure:
        include: health,info
