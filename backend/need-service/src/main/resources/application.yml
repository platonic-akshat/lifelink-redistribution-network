server:
  port: 8082

spring:
  application:
    name: need-service
  datasource:
    url: jdbc:postgresql://localhost:5432/need_db
    username: lifelink
    password: lifelink
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health,info
