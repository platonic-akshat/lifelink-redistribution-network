<div class="page">
  <header class="page-header">
    <h1>Logistics Tracking</h1>
    <div class="actions">
      <a routerLink="/matches">Matches</a>
      <button class="refresh" (click)="fetchAll()" [disabled]="isLoading">
        {{ isLoading ? 'Refreshing…' : 'Refresh' }}
      </button>
    </div>
  </header>

  <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

  <p *ngIf="!isLoading && records.length === 0" class="empty">
    No approved matches yet. Approve a match on the Matches page to track its
    logistics here.
  </p>

  <div class="logistics-list" *ngIf="records.length > 0">
    <div class="logistics-card" *ngFor="let record of records">
      <div class="card-header">
        <span class="match-id">Match {{ shortId(record.matchId) }}</span>
        <span class="status-badge" [class]="'status-' + record.status.toLowerCase()">
          {{ record.status }}
        </span>
      </div>
      <p class="updated-at">Updated {{ record.updatedAt | date: 'short' }}</p>
      <p class="notes" *ngIf="record.notes">{{ record.notes }}</p>

      <div class="card-actions" *ngIf="record.status !== 'DELIVERED' && record.status !== 'FAILED'">
        <button
          *ngIf="record.status === 'SCHEDULED'"
          (click)="markPickedUp(record.matchId)"
          [disabled]="pendingActionMatchId === record.matchId"
        >
          Mark Picked Up
        </button>
        <button
          *ngIf="record.status === 'PICKED_UP'"
          (click)="markDelivered(record.matchId)"
          [disabled]="pendingActionMatchId === record.matchId"
        >
          Mark Delivered
        </button>
        <button
          class="fail"
          (click)="markFailed(record.matchId)"
          [disabled]="pendingActionMatchId === record.matchId"
        >
          Mark Failed
        </button>
      </div>
    </div>
  </div>
</div>
